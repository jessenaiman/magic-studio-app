[package]
name = "magic-mcp"
description = "Magic Studio MCP server: JSON-RPC 2.0 over stdio, driving a running app or a headless session"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
log = { workspace = true }
magic = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "sync"] }
schemars = "1"
