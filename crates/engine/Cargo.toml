[package]
name = "magic-engine"
description = "Magic Studio engine: command registry and session for 2D/3D turnaround animation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
image = { workspace = true }
glam = { workspace = true }
sha2 = "0.10"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }

# Craft engines and shared Craft libraries called directly in-process
craft-atomic = { workspace = true }
craft-doc = { workspace = true }
craft-docpath = { workspace = true }
craft-media = { workspace = true }
craft-update = { workspace = true }
deckcraft-engine = { workspace = true }
designcraft-engine = { workspace = true }
designcraft-render = { workspace = true }
effectcraft-engine = { workspace = true }
effectcraft-host = { workspace = true }
filmcraft-audio-dsp = { workspace = true }
filmcraft-captions = { workspace = true }
filmcraft-engine = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-speech = { workspace = true }
filmcraft-time = { workspace = true }
photocraft-engine = { workspace = true }
texturecraft-formats = { workspace = true }
vectorcraft-engine = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "net", "process"] }