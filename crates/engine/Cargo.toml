[package]
name = "magic-engine"
description = "Magic Studio engine: command registry and session for 2D/3D turnaround animation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
image = { workspace = true }
glam = { workspace = true }
sha2 = "0.10"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }

# Craft engines called directly by the engine
deckcraft-engine = { workspace = true }
effectcraft-engine = { workspace = true }
effectcraft-host = { workspace = true }
filmcraft-engine = { workspace = true }
filmcraft-media = { workspace = true }
photocraft-engine = { workspace = true }
texturecraft-formats = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "net", "process"] }