<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Magic Studio — Craft Web</title>
  <link data-trunk rel="rust" data-wasm-opt="2" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0b0e;
      color: #eceff4;
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }
    #the_canvas_id {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.04em;
      font-size: 13px;
      color: #9aa3b5;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="the_canvas_id"></canvas>
  <div id="loading">Loading Magic Studio…</div>
</body>
</html>
