[package]
name = "magic-web"
description = "Magic Studio in the browser (wasm32): eframe WebRunner mounting magic-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is wasm32-only: on desktop targets this crate is empty so `cargo test --workspace`
# and `cargo clippy --workspace` stay fast and OS-independent.
[target.'cfg(target_arch = "wasm32")'.dependencies]
craft-web-host = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
egui = { workspace = true }
log = { workspace = true }
magic = { workspace = true }
magic-ui-egui = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
