[package]
name = "magic"
description = "Magic Studio desktop app over magic-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "magic"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Release builds ship without the webview inspector; debug builds always include it.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
magic = { workspace = true }
image = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { version = "2", features = ["protocol-asset"] }
craft-dialogs = { workspace = true }
craft-keymap = { workspace = true }
craft-ui = { workspace = true }
effectcraft-engine = { workspace = true }
effectcraft-ui-egui = { workspace = true }
filmcraft-engine = { workspace = true }
filmcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "wayland", "x11"] }
cpal = "0.16"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
clap = { version = "4.6", features = ["derive", "env"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-os = "2"
subtle = { workspace = true }
tauri-plugin-persisted-scope = "2"

# Window capture for `ui.screenshot`: WebKitGTK snapshot encoded as PNG by cairo. Both crates are
# already in the Tauri dependency graph; `png` only exposes cairo's PNG writer.
[target.'cfg(target_os = "linux")'.dependencies]
winit = "0.30"
webkit2gtk = "2.0"
cairo-rs = { version = "0.18", features = ["png"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = "2"
