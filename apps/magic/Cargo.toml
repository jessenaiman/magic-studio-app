[package]
name = "magic"
description = "Magic Studio desktop app (eframe + magic-ui-egui + magic-engine)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "magic"

[features]
default = ["lyrics-webview"]
lyrics-webview = ["dep:wry", "dep:gtk", "dep:winit"]

[lints]
workspace = true

[[bin]]
name = "magic"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "wayland", "x11", "system_fonts", "inspection"] }
egui = { workspace = true }
log = { workspace = true }
magic = { workspace = true }
magic-ui-egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
gtk = { version = "0.18", optional = true }
winit = { version = "0.30", default-features = false, features = ["x11"], optional = true }
wry = { version = "=0.57.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.16"
