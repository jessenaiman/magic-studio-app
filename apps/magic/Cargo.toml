[package]
name = "magic"
description = "Magic Studio desktop app (eframe + magic-ui-egui + magic-engine)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "magic"

[features]
default = ["lyrics-webview"]
lyrics-webview = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true }

[lints]
workspace = true

[[bin]]
name = "magic"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "wayland", "x11"] }
egui = { workspace = true }
log = { workspace = true }
magic = { workspace = true }
magic-ui-egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
tauri = { version = "=2.12.5", optional = true }
