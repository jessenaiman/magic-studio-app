[package]
name = "magic-tauri"
description = "Magic Studio desktop GUI: Tauri webview over magic-engine (Tauri edition)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "magic-tauri"
path = "src/main.rs"

[features]
# Release builds ship without the webview inspector; debug builds always include it.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
magic = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
tauri-plugin-websocket = "2"
log = "0.4"
clap = { version = "4.6", features = ["derive", "env"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
subtle = { workspace = true }

# Window capture for `ui.screenshot`: WebKitGTK snapshot encoded as PNG by cairo. Both crates are
# already in the Tauri dependency graph; `png` only exposes cairo's PNG writer.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
cairo-rs = { version = "0.18", features = ["png"] }
