[package]
name = "magic-tauri"
description = "Magic Studio desktop GUI: Tauri webview over magic-engine (Tauri edition)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "magic-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
magic = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-cli = { version = "2" }
tauri-plugin-opener = { version = "2" }
tauri-plugin-store = { version = "2" }
tauri-plugin-shell = { version = "2" }
tauri-plugin-log = { version = "2" }
tauri-plugin-websocket = { version = "2" }
log = "0.4"
clap = { version = "4.6", features = ["derive", "env"] }
