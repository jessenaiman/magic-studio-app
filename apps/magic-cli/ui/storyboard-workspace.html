<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magic Studio — Storyboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="global.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #view-storyboard { height: 100%; }
    .storyboard .panel-head { flex-wrap: wrap; justify-content: space-between; }
    #storyboard-rail { padding: var(--space-3); overflow: auto; }
    #storyboard-rail h1 { font-size: var(--text-lg); }
    #sb-cards img { display: block; width: 100%; }
    #sb-fields { width: clamp(15rem, 29vw, 22rem); min-height: 0; overflow: auto; padding: var(--space-3); border-left: 1px solid var(--line); }
    #sb-fields[hidden] { display: none; }
    #sb-fields label { display: grid; gap: var(--space-1); }
    #sb-fields input, #sb-fields textarea { width: 100%; }
    #sb-fields textarea { min-height: 4em; resize: vertical; }
    #sb-fields code { overflow-wrap: anywhere; }
    #sb-status { padding: var(--space-2) var(--space-3); margin: 0; overflow-wrap: anywhere; }
    @media (max-width: 52rem) { #sb-fields { width: min(50vw, 20rem); } }
  </style>
</head>
<body>
  <section class="view active" id="view-storyboard" aria-label="Storyboard workspace">
    <div class="project-body">
      <aside class="blocks" id="storyboard-rail" aria-label="Storyboard contents">
        <h1>Storyboard</h1>
        <button class="start" id="sb-new" hidden>New Board</button>
        <button class="ghost" id="sb-add" hidden>Add Scene</button>
        <nav id="sb-pages" aria-label="Pages"></nav>
        <section id="sb-cue" hidden aria-label="Scene cue"></section>
      </aside>
      <section class="storyboard" aria-label="Storyboard spread">
        <div class="panel-head" data-look="bar">
          <div class="sb-nav">
            <button class="icon" id="sb-prev" aria-label="Previous page" title="Previous page"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg></button>
            <span id="sb-page">—</span>
            <button class="icon" id="sb-next" aria-label="Next page" title="Next page"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg></button>
          </div>
          <div class="panel-actions">
            <button class="ghost" id="sb-refresh">Refresh</button>
            <button class="ghost" id="sb-open">Open in DesignCraft</button>
            <button class="ghost" id="sb-export">Export PDF</button>
            <button class="ghost" id="sb-edit" aria-controls="sb-fields" aria-expanded="false">Edit Fields</button>
          </div>
        </div>
        <div class="sb-title-wrap" id="sb-title-wrap">
          <div class="sb-title-cards document-pages" id="sb-cards"></div>
        </div>
        <p id="sb-status" class="muted" role="status"></p>
      </section>
      <aside id="sb-fields" aria-label="Page fields" hidden>
        <form id="sb-fields-form">
          <div class="panel-head"><span class="panel-title">Page Fields</span><button class="start" type="submit">Apply Edits</button></div>
          <div id="sb-fields-list"></div>
        </form>
      </aside>
    </div>
  </section>
  <script src="tauri-shim.js"></script>
  <script src="workspace-elements.js"></script>
  <script src="storyboard-workspace.js"></script>
</body>
</html>
