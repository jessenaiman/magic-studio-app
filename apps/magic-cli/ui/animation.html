<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Magic Studio — Animation</title>
<link rel="stylesheet" href="style.css"/><link rel="stylesheet" href="global.css"/><link rel="stylesheet" href="app-bar.css"/>
<style>html,body{margin:0;height:100%}#view-animation{height:100%;display:flex;gap:8px}.motion-main{flex:1;display:flex;flex-direction:column;min-width:0}#motion-stage{flex:1;min-height:200px}#motion-canvas{width:100%;height:100%}</style>
</head><body>
<section class="view active" id="view-animation" aria-label="Animation workspace"></section>
<script src="tauri-shim.js"></script><script src="feedback.js"></script><script src="workspace-elements.js"></script>
<script src="app.js"></script><script src="panel-header.js"></script><script src="inspector-controls.js"></script>
<script src="vendor/konva.bundle.js"></script><script src="vendor/rig-review.bundle.js"></script>
<script src="character-stage.js"></script><script src="animation-stage.js"></script><script src="animation.js"></script>
<script>
window.addEventListener("DOMContentLoaded", async () => {
  state.view = "animation";
  await loadComponents();
  try {
    const st = await invoke("project_state", {});
    state.project = st?.project || st?.status?.project || state.project;
    state.data = st;
  } catch {}
  await animationOpen();
});
</script>
</body></html>
