<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magic Studio — Film</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="app-bar.css" />
  <style>
    body { margin: 0; background: var(--bg); }
    #film-head { min-height: 0; padding: var(--space-1) var(--space-2); }
    #film-head .panel-actions { max-width: calc(100% - 3rem); }
    #film-status { padding: 0 var(--space-2); margin: 0; font-size: var(--text-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <header id="film-head" class="panel-head inline" aria-label="Film">
    <span class="panel-title">Film</span>
    <div class="panel-actions">
      <button class="ghost" data-action="create" hidden>Create FilmCraft Project</button>
      <button class="ghost" data-action="assemble" hidden>Assemble</button>
      <button class="ghost" data-action="reload" hidden>Reload</button>
      <button class="ghost" data-action="save" hidden>Save FilmCraft Project</button>
      <button class="ghost" data-action="import">Import Rendered Animation…</button>
      <button class="ghost" data-action="add-last" hidden>Add Last Animation Render</button>
      <button class="ghost" data-action="open">Open in FilmCraft</button>
      <button class="ghost" data-action="preview">Preview</button>
      <button class="ghost" data-action="open-preview" hidden>Play Preview</button>
      <button class="start" data-action="export">Export</button>
    </div>
  </header>
  <p id="film-status" class="muted" role="status"></p>
  <script src="tauri-adapter.js"></script>
  <script src="workspace-elements.js"></script>
  <script src="studio-workspace.js"></script>
</body>
</html>
