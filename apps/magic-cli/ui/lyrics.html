<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magic Studio — Lyrics</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="animation-review.css" />
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="drawers.css" />
  <link rel="stylesheet" href="menu.css" />
  <link rel="stylesheet" href="app-bar.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    main { height: 100vh; display: flex; flex-direction: column; }
    #view-design.view.active { flex: 1; height: 100%; overflow: auto; }
  </style>
</head>
<body>
  <main>
    <section class="view active" id="view-design" aria-label="Lyrics and motion graphics"></section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="tauri-shim.js"></script>
  <script src="feedback.js"></script>
  <script src="workspace-elements.js"></script>
  <script src="app.js"></script>
  <script src="panel-header.js"></script>
  <script src="inspector-controls.js"></script>
  <script src="words-design.js"></script>
  <script src="words-flow.js"></script>
  <script src="words.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      state.view = "design";
      try {
        const workspace = await nativeInvoke("execute_command", { id: "words.workspace", params: {} });
        if (workspace?.standalone) {
          state.lyricsOnly = true;
          state.project = workspace.path;
          state.data = { status: { stages: [{ id: "song", inputs: [{ path: workspace.audio }] }] } };
        } else {
          const st = await invoke("project_state", {});
          state.project = st?.project || st?.status?.project || state.project;
          state.data = st;
        }
      } catch {}
      await wordsOpen();
    });
  </script>
</body>
</html>
