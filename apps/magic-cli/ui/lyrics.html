<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magic Studio — Lyrics</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="animation-review.css" />
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="drawers.css" />
  <link rel="stylesheet" href="menu.css" />
  <link rel="stylesheet" href="app-bar.css" />
  <link rel="stylesheet" href="lyrics-layout.css" />
</head>
<body class="lyrics-workspace-page">
  <main>
    <section class="view active" id="view-design" aria-label="Lyrics and motion graphics"></section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="tauri-adapter.js"></script>
  <script src="feedback.js"></script>
  <script src="workspace-elements.js"></script>
  <script src="app.js"></script>
  <script src="panel-header.js"></script>
  <script src="inspector-controls.js"></script>
  <script src="words-design.js"></script>
  <script src="words-flow.js"></script>
  <script src="words.js"></script>
  <script src="drawing-controls.js"></script>
  <script src="native-word-controls.js"></script>
  <script src="lyrics-layout.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      state.view = "design";
      const motion = new URLSearchParams(location.search).get("workspace") === "motion";
      if (motion) {
        wordsPanel.motionWorkspace = true;
        wordsPanel.mode = "motion";
        wordsPanel.topShelf = "overlay";
        document.title = "Magic Studio — Motion";
        document.querySelector("#view-design").setAttribute("aria-label", "Motion overlays");
      }
      await loadComponents();
      try {
        const workspace = await nativeInvoke("execute_command", { id: "words.workspace", params: {} });
        if (workspace?.standalone) {
          state.lyricsOnly = true;
          state.project = workspace.path;
          state.data = { status: { stages: [{ id: "song", inputs: [{ path: workspace.audio }] }] } };
        } else {
          const st = await invoke("project_state", {});
          state.project = st?.project || st?.status?.project || state.project;
          state.data = st;
        }
      } catch {}
      if (motion && state.project) {
        const film = await wordsCommand("video.film").catch(() => null);
        const media = [
          { file: film?.preview, stale: film?.preview_stale },
          { file: film?.export, stale: film?.export_stale },
        ].filter(item => item.file?.exists);
        const source = media.find(item => !item.stale) || media[0];
        wordsPanel.motionMedia = source?.file;
        wordsPanel.motionMediaStale = source?.stale;
      }
      await wordsOpen();
      await acFeedback.report("ready");
    });
  </script>
</body>
</html>
