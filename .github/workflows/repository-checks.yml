name: Minimal CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One active CI job for this repository, across every branch and PR.
concurrency:
  group: magic-studio-minimal-ci
  cancel-in-progress: true

jobs:
  sanity:
    name: Syntax and source lint
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Lightweight checks only
        run: |
          set -euo pipefail
          node --version
          git diff --check HEAD^ HEAD
          npm ci --ignore-scripts
          npx tsc -p .
          node apps/src-tauri/scripts/ui-lint.mjs --report
