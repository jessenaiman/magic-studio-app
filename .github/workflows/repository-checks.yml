name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magic-studio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: TypeScript and whitespace
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Source checks
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          npm ci --ignore-scripts
          npx tsc -p .
  build:
    name: Native Linux build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
          rustup toolchain install 1.95.0 --profile minimal
      - name: Install locked frontend dependencies
        run: |
          npm ci --ignore-scripts
          cd apps/src-tauri/frontend
          bun install --frozen-lockfile
      - name: Build app, CLI and Backstage from this commit
        run: cargo +1.95.0 build -p magic-studio -p magic-cli -p backstage --locked
      - name: Publish built binaries
        uses: actions/upload-artifact@v4
        with:
          name: magic-studio-linux-${{ github.sha }}
          path: |
            target/debug/magic-studio
            target/debug/magic-cli
            target/debug/backstage
          if-no-files-found: error
