name: Feature request
description: Suggest a Magic Studio improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: what_where
    attributes:
      label: What and Where
      placeholder: |
        - Requested capability and affected area.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      placeholder: |
        - User need and expected benefit.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How
      placeholder: |
        - Proposed approach or example workflow.
        - Relevant references or alternatives.
    validations:
      required: true
  - type: textarea
    id: success_criteria
    attributes:
      label: Success criteria
      placeholder: |
        - Observable outcomes that make this request complete.
    validations:
      required: true
