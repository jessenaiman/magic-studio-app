name: Bug report
description: Report a reproducible Magic Studio problem
labels: ["bug"]
body:
  - type: textarea
    id: what_where
    attributes:
      label: What and Where
      placeholder: |
        - What failed, and where (screen, command, file, or pipeline)?
        - Environment and actual behavior.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      placeholder: |
        - Impact on your workflow.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How
      placeholder: |
        - Steps or commands to reproduce.
        - Relevant logs or evidence.
    validations:
      required: true
  - type: textarea
    id: success_criteria
    attributes:
      label: Success criteria
      placeholder: |
        - Expected behavior.
        - Observable checks that confirm the fix.
    validations:
      required: true
