[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.17.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/jessenaiman/magic-studio-app"

[workspace.dependencies]
# Magic's own engine
magic-engine = { path = "crates/engine" }

# Craft engines
photocraft-engine = { git = "https://github.com/storytold/photocraft" }
vectorcraft-engine = { git = "https://github.com/storytold/vectorcraft" }
filmcraft-engine = { git = "https://github.com/storytold/filmcraft" }
lightcraft-engine = { git = "https://github.com/storytold/lightcraft" }
pdfcraft-engine = { git = "https://github.com/storytold/pdfcraft" }
effectcraft-engine = { git = "https://github.com/storytold/effectcraft" }
designcraft-engine = { git = "https://github.com/storytold/designcraft" }
figcraft-engine = { git = "https://github.com/storytold/figcraft" }
wordcraft-engine = { git = "https://github.com/storytold/wordcraft" }
soundcraft-engine = { git = "https://github.com/storytold/soundcraft" }
deckcraft-engine = { git = "https://github.com/storytold/deckcraft" }
cadcraft-engine = { git = "https://github.com/storytold/cadcraft" }
gridcraft-engine = { git = "https://github.com/storytold/gridcraft" }
texturecraft-engine = { git = "https://github.com/storytold/texturecraft" }
materialcraft-engine = { git = "https://github.com/storytold/materialcraft" }
craft-anything-engine = { git = "https://github.com/storytold/craft-anything" }
solidcraft-engine = { git = "https://github.com/tangency-labs/solidcraft" }

# Additional Craft crates used or declared by Magic
filmcraft-media = { git = "https://github.com/storytold/filmcraft" }
effectcraft-host = { git = "https://github.com/storytold/effectcraft" }
effectcraft-ui-egui = { git = "https://github.com/storytold/effectcraft" }
texturecraft-formats = { git = "https://github.com/storytold/texturecraft" }

# Shared foundations
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = "2.5.8"
log = "0.4"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
proptest = "1"
roxmltree = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
glam = "0.24"

# Shared Craft and UI libraries
craft-docpath = { git = "https://github.com/storytold/craft-libs", version = "0.1.0" }
craft-media = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", default-features = false }
craft-ui = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", features = ["serde", "native-windows"] }
craft-update = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", features = ["egui"] }
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git" }
emath = { git = "https://github.com/storytold/egui.git" }
epaint = { git = "https://github.com/storytold/egui.git" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git" }
egui = { git = "https://github.com/storytold/egui.git" }
egui-winit = { git = "https://github.com/storytold/egui.git" }
egui-wgpu = { git = "https://github.com/storytold/egui.git" }
egui_glow = { git = "https://github.com/storytold/egui.git" }
egui_extras = { git = "https://github.com/storytold/egui.git" }
egui_kittest = { git = "https://github.com/storytold/egui.git" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git" }
eframe = { git = "https://github.com/storytold/egui.git" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git" }
egui_inspection = { git = "https://github.com/storytold/egui.git" }
winit = { git = "https://github.com/storytold/winit.git" }
krilla = { git = "https://github.com/storytold/craft-libs", version = "0.8.2" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", version = "0.7.2" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", version = "0.3.0" }