[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.17.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/jessenaiman/magic-studio-app"

[workspace.dependencies]
# Magic's own engine, MCP server, and egui frontend
magic = { path = "crates/engine" }
magic-mcp = { path = "crates/mcp" }
magic-ui-egui = { path = "crates/ui-egui" }

# Craft engines and domain crates (version-independent git tracking for `cargo update`)
designcraft-engine = { git = "https://github.com/storytold/designcraft" }
designcraft-render = { git = "https://github.com/storytold/designcraft" }
effectcraft-engine = { git = "https://github.com/storytold/effectcraft" }
effectcraft-host = { git = "https://github.com/storytold/effectcraft" }
filmcraft-audio-dsp = { git = "https://github.com/storytold/filmcraft", rev = "7322aad72491a294a06a26a63fb65a3fc30ac242" }
filmcraft-captions = { git = "https://github.com/storytold/filmcraft", rev = "7322aad72491a294a06a26a63fb65a3fc30ac242" }
filmcraft-engine = { git = "https://github.com/storytold/filmcraft", rev = "7322aad72491a294a06a26a63fb65a3fc30ac242", features = ["whisper", "speech-download"] }
filmcraft-media = { git = "https://github.com/storytold/filmcraft", rev = "7322aad72491a294a06a26a63fb65a3fc30ac242" }
filmcraft-time = { git = "https://github.com/storytold/filmcraft", rev = "7322aad72491a294a06a26a63fb65a3fc30ac242" }
photocraft-engine = { git = "https://github.com/storytold/photocraft" }
texturecraft-formats = { git = "https://github.com/storytold/texturecraft" }
vectorcraft-engine = { git = "https://github.com/storytold/vectorcraft", default-features = false }

# Keep Magic's Craft libraries and the PDF patches below on the same revision.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c" }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c" }
craft-doc = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c" }
craft-docpath = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c" }
craft-ecproj-format = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c" }
craft-media = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c", default-features = false }
craft-pcraft-format = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c", features = ["serde", "native-windows"] }
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c", features = ["egui"] }
craft-vectorcraft-format = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c" }

# Shared Craft AI integrations (`storytold/craft-ai-integrations`, version-independent git tracking)
craft-ai-client = { git = "https://github.com/storytold/craft-ai-integrations" }
craft-ai-core = { git = "https://github.com/storytold/craft-ai-integrations" }
craft-ai-egui = { git = "https://github.com/storytold/craft-ai-integrations" }

# CLI, TUI, MCP, and system foundations
clap = { version = "4", features = ["derive", "env"] }
glam = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
rustix = { version = "1", features = ["fs", "net", "process"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

# Desktop & Web egui UI packages (`crates/ui-egui`, `apps/magic`, `apps/magic-web`)
eframe = { version = "0.37", default-features = false }
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", default-features = false }
open = "5"
raw-window-handle = "0.6"
rfd = "0.17"
subtle = "2.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# symphonia's FLAC decoder restores LPC samples as `residual + (prediction as i32)`. In a valid
# 32-bit stream the prediction can leave the i32 range while the sum does not, so a debug build
# panics where a release build wraps to the right sample.
[profile.dev.package.symphonia-bundle-flac]
overflow-checks = false

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c" }
hayro = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "e653048a187036d30fd912f35f14b32ab4084e5c" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
