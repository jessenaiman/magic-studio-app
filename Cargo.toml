[workspace]
resolver = "3"
members = ["crates/scribbles", "crates/engine", "crates/mcp", "apps/magic", "apps/magic-cli", "apps/magic-tui", "xtask"]

[workspace.package]
version = "0.17.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/jessenaiman/magic-studio-app"

[workspace.dependencies]
# Magic's own engine, Scribbles Flow bridge, and MCP server
craft-scribbles = { path = "crates/scribbles" }
magic = { package = "magic-engine", path = "crates/engine" }
magic-mcp = { path = "crates/mcp" }

# Craft engines and domain crates (`storytold/*`, version-independent git tracking for `cargo update`)
anicraft-doc = { git = "https://github.com/storytold/anicraft" }
anicraft-engine = { git = "https://github.com/storytold/anicraft" }
anicraft-geom = { git = "https://github.com/storytold/anicraft" }
anicraft-render = { git = "https://github.com/storytold/anicraft" }
effectcraft-engine = { git = "https://github.com/storytold/effectcraft" }
effectcraft-ui-egui = { git = "https://github.com/storytold/effectcraft" }
filmcraft-codecs = { git = "https://github.com/storytold/filmcraft" }
filmcraft-engine = { git = "https://github.com/storytold/filmcraft", features = ["whisper", "speech-download"] }
filmcraft-export = { git = "https://github.com/storytold/filmcraft" }
filmcraft-gpu = { git = "https://github.com/storytold/filmcraft" }
filmcraft-media = { git = "https://github.com/storytold/filmcraft" }
filmcraft-project = { git = "https://github.com/storytold/filmcraft" }
filmcraft-render = { git = "https://github.com/storytold/filmcraft" }
filmcraft-time = { git = "https://github.com/storytold/filmcraft" }
filmcraft-ui-egui = { git = "https://github.com/storytold/filmcraft" }

# Shared Craft libraries (`storytold/craft-libs`, version-independent git tracking for `cargo update`)
craft-atomic = { git = "https://github.com/storytold/craft-libs" }
craft-audio = { git = "https://github.com/storytold/craft-libs", features = ["decode", "peaks"] }
craft-dialogs = { git = "https://github.com/storytold/craft-libs" }
craft-doc = { git = "https://github.com/storytold/craft-libs" }
craft-docpath = { git = "https://github.com/storytold/craft-libs" }
craft-ecproj-format = { git = "https://github.com/storytold/craft-libs" }
craft-keymap = { git = "https://github.com/storytold/craft-libs" }
craft-media = { git = "https://github.com/storytold/craft-libs", default-features = false }
craft-settings = { git = "https://github.com/storytold/craft-libs" }
craft-ui = { git = "https://github.com/storytold/craft-libs", features = ["serde", "native-windows"] }
craft-update = { git = "https://github.com/storytold/craft-libs" }

# Shared Craft AI integrations (`storytold/craft-ai-integrations`, version-independent git tracking)
craft-ai-client = { git = "https://github.com/storytold/craft-ai-integrations" }
craft-ai-core = { git = "https://github.com/storytold/craft-ai-integrations" }
craft-ai-native = { git = "https://github.com/storytold/craft-ai-integrations" }

# CLI, TUI, MCP, desktop control, and system foundations
eframe = { version = "0.37", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
glam = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
rustix = { version = "1", features = ["fs", "net", "process"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# symphonia's FLAC decoder restores LPC samples as `residual + (prediction as i32)`. In a valid
# 32-bit stream the prediction can leave the i32 range while the sum does not, so a debug build
# panics where a release build wraps to the right sample.
[profile.dev.package.symphonia-bundle-flac]
overflow-checks = false

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
krilla = { git = "https://github.com/storytold/craft-libs" }
hayro = { git = "https://github.com/storytold/craft-libs" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs" }
