repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        files: ^\.agents/skills/magic-[^/]+/.*\.md$
        args: [--no-globs]
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Rust formatting (manual)
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        files: ^(?:crates|apps)/.*\.rs$|(?:^|/)Cargo\.toml$
        stages: [manual]
      - id: cargo-clippy
        name: Rust lint (manual, no tests)
        entry: cargo clippy --workspace --lib --bins --locked --offline -- -D warnings
        language: system
        pass_filenames: false
        files: ^(?:crates|apps)/.*\.rs$|(?:^|/)Cargo\.(?:toml|lock)$
        stages: [manual]
